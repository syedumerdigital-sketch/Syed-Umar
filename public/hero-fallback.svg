<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <radialGradient id="neonGlowGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00FF87" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00FF87" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF87" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>
  </defs>

  <rect width="800" height="1000" rx="32" fill="url(#cardBg)" />
  <circle cx="400" cy="350" r="320" fill="url(#neonGlowGrad)" />

  <!-- Outer Neon Border Frame -->
  <rect x="20" y="20" width="760" height="960" rx="24" fill="none" stroke="url(#neonBorder)" stroke-width="4" stroke-opacity="0.6" />

  <!-- Silhouette / Artistic Portrait Geometry -->
  <g transform="translate(400, 360)">
    <!-- Aura Rings -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#00FF87" stroke-width="2" stroke-dasharray="8 6" stroke-opacity="0.4" />
    <circle cx="0" cy="0" r="150" fill="#0B0F17" stroke="#00FF87" stroke-width="3" stroke-opacity="0.7" />
    
    <!-- Stylized Avatar / Athlete & Dev Silhouette -->
    <path d="M-50,80 C-40,20 -30,0 0,0 C30,0 40,20 50,80 C60,110 90,130 110,140 C80,145 -80,145 -110,140 C-90,130 -60,110 -50,80 Z" fill="#1E293B" stroke="#00FF87" stroke-width="2" />
    <!-- Head / Sunglasses Silhouette -->
    <circle cx="0" cy="-45" r="45" fill="#334155" stroke="#00FF87" stroke-width="2" />
    <!-- Stylish Glasses / Visor -->
    <rect x="-35" y="-55" width="70" height="18" rx="6" fill="#00FF87" fill-opacity="0.7" />
  </g>

  <!-- Profile Title Overlay -->
  <text x="400" y="640" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
    SYED MUHAMMAD UMER
  </text>
  <text x="400" y="685" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="600" fill="#00FF87" letter-spacing="1.5">
    FOUNDER · SU DIGITAL
  </text>
  <text x="400" y="730" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="500" fill="#94A3B8">
    Web Developer · Financial Trader · BWF Athlete
  </text>

  <!-- Status Badge Pill -->
  <g transform="translate(400, 800)">
    <rect x="-170" y="-22" width="340" height="44" rx="22" fill="#0B0F17" stroke="#00FF87" stroke-width="1.5" stroke-opacity="0.5" />
    <circle cx="-135" cy="0" r="5" fill="#00FF87" />
    <text x="-115" y="6" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">
      Available for High-Impact Projects
    </text>
  </g>

  <!-- Location Tag -->
  <text x="400" y="890" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="500" fill="#64748B">
    Karachi, Pakistan · syedumer.digital@gmail.com
  </text>
</svg>
